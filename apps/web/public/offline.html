    <!-- Página offline do service worker: AUTOCONTIDA (sem fontes, CSS ou JS externos). Mesma arte do
         jogo (a galinha vem de app/icones/arte.ts, cópia de arte/animais/Galinha.tsx) e o mesmo contrato
         visual (DIRECAO_DE_ARTE: céu, painel creme com faixa, botão 3D laranja, texto com contorno). -->
    <style>
      :root {
        color-scheme: light;
        --contorno: #2b1a0f;
        --titulo: 'Lilita One', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Segoe UI Black', system-ui, sans-serif;
        --texto: 'Nunito', ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, sans-serif;
        /* lado do herói (galinha no ninho): tudo em volta dele se mede por aqui */
        --heroi: 210px;
      }
      * { box-sizing: border-box; }
      html { font-synthesis: none; -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: var(--texto);
        color: #2b1d12;
        /* sem "fixed": a página não rola e o fundo fixo força repintura */
        background: linear-gradient(180deg, #49b8ff 0%, #8fd6ff 28%, #c4ecff 55%, #dff6c8 100%);
      }

      /* Palco: ocupa a tela e recorta os raios de sol (que são maiores que ela) sem criar rolagem. */
      .palco {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
        overflow: hidden;
      }

      /* ------------------------------------------- cenário da frente (nuvens e morro, atrás do conteúdo) */
      .cenario { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
      .nuvem { position: absolute; width: 132px; height: auto; animation: vagar 26s ease-in-out infinite alternate; }
      .nuvem.n1 { left: -22px; top: 7%; }
      .nuvem.n2 { right: -30px; top: 3%; width: 104px; animation-duration: 32s; animation-delay: -9s; }
      .morro {
        position: absolute;
        left: -20%;
        right: -20%;
        bottom: -24vh;
        height: 46vh;
        border-radius: 50% 50% 0 0 / 34% 34% 0 0;
        background: linear-gradient(180deg, #9be36a 0%, #6cc644 22%, #3f8f2a 100%);
        box-shadow: inset 0 6px 0 rgb(212 255 158 / 0.8);
      }

      /* -------------------------------------------------------------------------------- conteúdo */
      main { position: relative; width: 100%; max-width: 360px; display: grid; justify-items: center; }

      /* Sol atrás da cabeça da galinha: ponto de tamanho zero posicionado pelo herói. Os raios são um SVG
         de 18 triângulos com opacidade radial; só giram por transform (camada composta, sem repintura). */
      .sol { position: absolute; left: 50%; top: calc(var(--heroi) * 0.36); width: 0; height: 0; z-index: -1; pointer-events: none; }
      .raios {
        position: absolute;
        left: 0;
        top: 0;
        width: 150vmax;
        height: 150vmax;
        margin: -75vmax 0 0 -75vmax;
        animation: girar 90s linear infinite;
        will-change: transform;
      }
      .halo {
        position: absolute;
        left: 0;
        top: 0;
        width: 120vmin;
        height: 120vmin;
        margin: -60vmin 0 0 -60vmin;
        background: radial-gradient(circle, rgb(255 246 200 / 0.95) 0, rgb(255 246 200 / 0.4) 30%, rgb(255 246 200 / 0) 62%);
      }

      .heroi { position: relative; width: var(--heroi); height: var(--heroi); margin-bottom: calc(var(--heroi) * -0.16); z-index: 1; }
      .galinha { width: 100%; height: 100%; overflow: visible; }
      .galinha .corpo { transform-box: fill-box; transform-origin: 50% 100%; animation: respirar 2.8s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
      .balao {
        position: absolute;
        right: -44px;
        top: -14px;
        width: 82px;
        height: 71px;
        transform-origin: 15% 100%;
        animation: balao 2.4s cubic-bezier(0.37, 0, 0.63, 1) infinite;
      }
      .brilho { position: absolute; width: 28px; height: 28px; animation: piscar 2.2s ease-in-out infinite; }
      .brilho.b1 { left: -22px; top: 40%; }
      .brilho.b2 { left: 4px; top: 10%; width: 18px; height: 18px; animation-delay: -0.8s; }
      .brilho.b3 { right: -16px; top: 56%; width: 20px; height: 20px; animation-delay: -1.5s; }

      .painel {
        position: relative;
        width: 100%;
        padding: 42px 22px 28px;
        text-align: center;
        border-radius: 26px;
        background: linear-gradient(180deg, #fffcf3 0%, #fff6e0 60%, #fbedcd 100%);
        border: 4px solid #6b4a26;
        box-shadow: inset 0 3px 0 #ffffff, inset 0 -5px 0 rgb(236 213 164 / 0.9), 0 6px 0 2px rgb(43 26 15 / 0.22);
      }
      /* Faixa de título: fita azul com as pontas (SVG com contorno e dobra escura) presas atrás dela. */
      .faixa { position: relative; display: inline-block; margin: 0 26px 22px; isolation: isolate; white-space: nowrap; }
      .faixa .ponta { position: absolute; top: 16px; width: 40px; height: 50px; z-index: -1; overflow: visible; }
      .faixa .ponta.e { left: -26px; }
      .faixa .ponta.d { right: -26px; transform: scaleX(-1); }
      .faixa h1 {
        margin: 0;
        padding: 8px 26px 10px;
        border-radius: 14px;
        border: 3px solid #0b2d66;
        background: linear-gradient(180deg, #a8dcff 0%, #46a8ff 32%, #1868d0 100%);
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.6), 0 4px 0 #0b2d66;
        font: 400 26px/30px var(--titulo);
      }
      .contorno {
        color: #fff;
        font-weight: 900;
        -webkit-text-stroke: 0.16em var(--cor, var(--contorno));
        paint-order: stroke fill;
        text-shadow: 0 0.09em 0 var(--cor, var(--contorno));
        letter-spacing: 0.01em;
      }
      @supports not (paint-order: stroke fill) {
        .contorno {
          -webkit-text-stroke: 0;
          text-shadow: 2px 0 0 var(--cor, var(--contorno)), -2px 0 0 var(--cor, var(--contorno)), 0 2px 0 var(--cor, var(--contorno)),
            0 -2px 0 var(--cor, var(--contorno)), 0 4px 0 var(--cor, var(--contorno));
        }
      }
      .faixa h1.contorno { --cor: #0b2d66; }
      p { margin: 0 auto; max-width: 290px; font-size: 16px; line-height: 22px; font-weight: 700; color: #6e5a46; }

      .botao {
        --cor: #6b2c00;
        position: relative;
        margin-top: 22px;
        min-width: 230px;
        min-height: 58px;
        padding: 0 28px 4px;
        border-radius: 18px;
        border: 3px solid #6b2c00;
        background: linear-gradient(180deg, #ffd36b 0%, #ff9d1e 48%, #e06a00 100%);
        box-shadow: inset 0 3px 0 rgb(255 255 255 / 0.55), inset 0 -4px 0 rgb(107 44 0 / 0.25), 0 5px 0 #6b2c00, 0 8px 0 rgb(43 26 15 / 0.18);
        font: 400 22px/1 var(--titulo);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: translate 90ms cubic-bezier(0.32, 0, 0.67, 0), box-shadow 90ms;
      }
      /* brilho em "pílula" no alto do botão */
      .botao::after {
        content: '';
        position: absolute;
        left: 12px;
        right: 12px;
        top: 5px;
        height: 9px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.35);
        pointer-events: none;
      }
      .botao:active {
        translate: 0 4px;
        box-shadow: inset 0 3px 0 rgb(255 255 255 / 0.45), inset 0 -2px 0 rgb(107 44 0 / 0.25), 0 1px 0 #6b2c00;
      }
      .botao:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

      @keyframes girar { to { rotate: 360deg; } }
      @keyframes vagar { to { translate: 26px 6px; } }
      @keyframes respirar { 0%, 100% { scale: 1 1; } 50% { scale: 1.025 0.985; } }
      @keyframes balao { 0%, 100% { translate: 0 0; rotate: 0deg; } 50% { translate: 0 -5px; rotate: -4deg; } }
      @keyframes piscar { 0%, 100% { scale: 0.6; opacity: 0.45; } 50% { scale: 1; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .raios { will-change: auto; }
      }
      /* celular alto: herói maior para não sobrar céu vazio */
      @media (min-height: 760px) {
        :root { --heroi: 250px; }
      }
      @media (max-height: 600px) {
        :root { --heroi: 150px; }
      }
    </style>
  </head>
